[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-chatbot"
version = "1.0.0"
description = "Retrieval-augmented chatbot that answers questions about legal contracts and extracts key fields."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Houda Mardas" }]
keywords = ["rag", "llm", "langchain", "faiss", "legal-tech", "nlp"]
dependencies = [
    "python-dotenv>=1.0",
    "requests>=2.31",
    "dateparser>=1.2",
    "pydantic>=2.5",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
rag = [
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
]
app = [
    "legal-chatbot[rag]",
    "streamlit>=1.37",
    "transformers>=4.40",
    "sentencepiece>=0.2",
    "torch>=2.2",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
legal-chatbot = "legal_chatbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text legitimately contains typographic characters

[tool.ruff.lint.per-file-ignores]
"src/legal_chatbot/prompts.py" = ["E501"]  # prompt text is kept verbatim
